<!doctype html>
<html lang="ko">
<head>

  <title>하네스 도면 자재 판별 — 사내 매핑·신규 표시·데이터 추출</title>

  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">

<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="inner header-inner">
      <a class="brand" href="#/masters">
        <span class="brand-name">하네스 도면 자재 판별</span>
        <span class="brand-sub">사내 자재 매핑 · 도면 위 신규 표시 · 자재 데이터 추출</span>
      </a>
      <nav class="nav" id="nav" aria-label="주 메뉴">
        <a href="#/masters" data-route="masters"><span class="step">1</span>마스터 데이터</a>
        <a href="#/drawing" data-route="drawing"><span class="step">2</span>도면 자재 판별</a>

        <a href="#/parts" data-route="parts" class="nav-next"><span class="step">B1</span>부품 LIST</a>
        <a href="#/check" data-route="check" class="nav-next"><span class="step">B2</span>검증·산출</a>
        <a href="#/bom" data-route="bom" class="nav-next"><span class="step">B3</span>BOM</a>
        <a href="#/settings" data-route="settings">설정</a>
      </nav>
    </div>
  </header>

  <div id="sampleBanner" class="sample-banner" hidden>예시 데이터 — 가상의 도면·품번·자재 코드로 시연 중입니다. 실제 자료가 아닙니다.</div>
  <div id="storageBanner" class="warn-banner" hidden>이 브라우저에 저장할 수 없어 창을 닫으면 입력이 사라집니다. 결과는 BOM 엑셀로 내보내 보관하세요.</div>

  <main id="main" class="inner main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="inner">1차 목표 도구(v0.3) · 도면과 엑셀은 이 브라우저 안에서만 읽고 계산하며 외부로 보내지 않습니다</div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 id="dialogTitle"></h2>
      <div id="dialogContent"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </form>
  </dialog>

  <!-- 로컬 파일(file://)로 열어도 돌도록 module 이 아닌 일반 스크립트로 불러옵니다 -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/drawing-logic.js"></script>
  <script src="js/drawing-learn.js"></script>
  <script src="js/drawing-sample.js"></script>
  <script src="js/drawing-sample-pdf.js"></script>
  <script src="js/drawing-sample-pdf-b.js"></script>
  <script src="js/view-drawing.js"></script>
  <script src="js/app.js"></script>
